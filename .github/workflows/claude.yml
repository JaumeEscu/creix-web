name: Claude canvis web

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: |
      (github.event_name == 'issues') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Ets el sistema de manteniment de la web de Creix. Llegeix la petició d'aquesta issue
            (o l'últim comentari), segueix CLAUDE.md, fes el canvi en una branca nova i obre una
            pull request que tanqui la issue. Netlify en farà la URL de prova automàticament.
